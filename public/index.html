<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTrack — Personalized Study Tracking & Assessment</title>
  <meta name="description" content="Track your custom syllabus progress, record daily study logs, generate personalized question papers from completed topics, and master weak areas through targeted revision.">
  
  <!-- Modern Inter typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234f46e5%22/><text y=%2268%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 font-family=%22sans-serif%22>ST</text></svg>">
</head>
<body>
  <!-- App Mounting Root -->
  <div id="app-root">
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:#f8fafc; font-family:'Inter', sans-serif;">
      <div style="text-align:center;">
        <div style="width:48px; height:48px; border:3px solid #6366f1; border-top-color:transparent; border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;"></div>
        <h2 style="font-weight:700; letter-spacing:-0.02em;">Initializing StudyTrack...</h2>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <!-- Application Script Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/views/authView.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/subjects.js"></script>
  <script src="/js/views/syllabus.js"></script>
  <script src="/js/views/studyLog.js"></script>
  <script src="/js/views/weeklyReview.js"></script>
  <script src="/js/views/paperGenerator.js"></script>
  <script src="/js/views/testHistory.js"></script>
  <script src="/js/views/revision.js"></script>
  <script src="/js/views/analytics.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
